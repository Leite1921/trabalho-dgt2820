<!DOCTYPE html>
<html lang="pt-br">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Catálogo de Receitas</title>
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    </head>
    <body class="bg-warning" onload="preencheCatalogo()">
        
        <div class="container-fluid">
            <h1 class="text-center pt-3">Catálogo de Receitas</h1>
            
            <div id="pnlCatalogo" class="d-flex flex-wrap justify-content-center gap-3 p-3">
                </div>
        </div>

        <script>
            // Dados das receitas
            // Dados das receitas com IMAGENS REAIS
        const receitas = [
            {
                titulo: "Arroz de Couve-Flor",
                imagem: "https://s2-receitas.glbimg.com/VJcdN0CLh4-mst9DpRmTZ9UI-k0=/0x0:1920x1080/984x0/smart/filters:strip_icc()/i.s3.glbimg.com/v1/AUTH_1f540e0b94d8437dbbc39d567a1dee68/internal_photos/bs/2022/K/h/QP077fSAAArU3btO5kkg/falso-arroz-de-couve-flor.jpg", 
                preparo: "Deixe a couve-flor picada. Adicione os ingredientes e refogue bem. Adicione sal, tampe a panela e deixe cozinhar.",
                ingredientes: ["Arroz", "Couve-Flor", "Cebola Média", "Azeite"]
            },
            {
                titulo: "Bolo de Café",
                imagem: "https://s2-receitas.glbimg.com/-QFRVaHV95ByDaPmq3DSB4zd9k8=/0x0:1920x1080/984x0/smart/filters:strip_icc()/i.s3.glbimg.com/v1/AUTH_1f540e0b94d8437dbbc39d567a1dee68/internal_photos/bs/2022/c/N/Jy3UHVQAaeQM8xXMjhTQ/bolo-de-cafe.jpg",
                preparo: "Bata o açúcar, as gemas e o café. Adicione farinha e chocolate e mexa bem. Bata as claras e junte à mistura.",
                ingredientes: ["Farinha de Trigo", "Açúcar", "Café Coado", "Chocolate em Pó", "Ovos"]
            },
            {
                titulo: "Coxinha de Brigadeiro",
                imagem: "https://www.receitasnestle.com.br/sites/default/files/styles/recipe_detail_desktop_new/public/srh_recipes/bcab5be00f2765a0d799cefcdeef33a1.webp?itok=747ABsAC",
                preparo: "Junte o leite condensado, chocolate em pó e manteiga. Aqueça no fogo baixo. Envolva os morangos e passe no granulado.",
                ingredientes: ["Leite Condensado", "Chocolate em Pó", "Manteiga", "Morango", "Chocolate Granulado"]
            }
        ];

            // Função getListaIngredientes (map e reduce)
            function getListaIngredientes(receita) {
                const lista = receita.ingredientes
                    .map(ingrediente => `<li>${ingrediente}</li>`)
                    .reduce((acc, item) => acc + item, '');
                return `<ul>${lista}</ul>`;
            }

            // Função getCard
            function getCard(receita) {
                return `
                    <div class="card" style="width: 250px;">
                        <img src="${receita.imagem}" class="card-img-top" alt="${receita.titulo}">
                        <div class="card-body">
                            <h5 class="card-title">${receita.titulo}</h5>
                            <div class="card-text">
                                ${getListaIngredientes(receita)}
                                <hr>
                                <p>${receita.preparo}</p>
                            </div>
                        </div>
                    </div>
                `;
            }

            // Função preencheCatalogo
            function preencheCatalogo() {
                const pnlCatalogo = document.getElementById('pnlCatalogo');
                const htmlCards = receitas
                    .map(receita => getCard(receita))
                    .reduce((acc, card) => acc + card, '');
                
                pnlCatalogo.innerHTML = htmlCards;
            }
        </script>
    </body>
</html>
