<!DOCTYPE html>
<html lang="pt-br">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Ordenando Valores</title>
        <script src="ordenando.js"></script>
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
        <style>
            body { padding: 20px; }
        </style>
    </head>
    <body>
        <h1>Ordenando Valores</h1>
        
        <div class="mb-3">
            <label for="valor" class="form-label">Valor</label>
            <input type="number" id="valor" class="form-control">
            <button onclick="add()" class="btn btn-primary mt-2">Adicionar</button>
        </div>

        <hr>

        <div class="mb-3">
            <select id="algoritmo" class="form-select">
                <option value="bubble" selected>Bubble Sort</option>
                <option value="selection">Selection Sort</option>
                <option value="quick">Quick Sort</option>
            </select>
            <div class="mt-2">
                <button onclick="ordenar()" class="btn btn-primary">Ordenar</button>
                <button onclick="misturar()" class="btn btn-primary">Misturar</button>
            </div>
        </div>

        <hr>
        
        <ul id="valores"></ul>

        <script>
            // Função Add
            function add() {
                const input = document.getElementById('valor');
                const lista = document.getElementById('valores');
                
                if (input.value === '') return; // Evita adicionar vazio

                const node = document.createElement('li');
                const texto = document.createTextNode(input.value);
                node.appendChild(texto);
                lista.appendChild(node);
                
                input.value = ''; // Limpa o campo
                input.focus();
            }

            // Função Ordenar
            function ordenar() {
                const lista = document.getElementById('valores');
                const select = document.getElementById('algoritmo');
                
                // Obtendo valores usando map e eval (conforme solicitado)
                let valores = Array.from(lista.children).map(item => eval(item.innerHTML));

                const algoritmo = select.options[select.selectedIndex].value;

                // Escolha do algoritmo
                if (algoritmo === 'bubble') {
                    bubble_sort(valores);
                } else if (algoritmo === 'selection') {
                    selection_sort(valores);
                } else if (algoritmo === 'quick') {
                    quick_sort(valores, 0, valores.length - 1);
                }

                // Gerando novos itens com map e reduce (conforme solicitado)
                lista.innerHTML = valores.map(val => `<li>${val}</li>`).reduce((acc, item) => acc + item, '');
            }

            // Função Misturar
            function misturar() {
                const lista = document.getElementById('valores');
                
                let valores = Array.from(lista.children).map(item => eval(item.innerHTML));

                shuffle(valores, valores.length * 2); // Embaralha

                lista.innerHTML = valores.map(val => `<li>${val}</li>`).reduce((acc, item) => acc + item, '');
            }
        </script>
    </body>
</html>
